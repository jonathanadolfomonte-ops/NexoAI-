name: Validación aislada de NexoAI Personal

on:
  workflow_dispatch:
  push:
    branches:
      - asistente-personal-groq-base-segura
    paths:
      - '**.js'
      - '**.json'
      - 'tests/**'
      - '.github/workflows/prueba-groq.yml'

permissions:
  contents: read

jobs:
  pruebas:
    name: Ejecutar suite automatizada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la rama aislada
        uses: actions/checkout@v4
        with:
          ref: asistente-personal-groq-base-segura

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar todas las pruebas
        run: npm test
