name: Lindsy FastAPI tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/test_lindsy.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - ".github/workflows/lindsy-tests.yml"
  push:
    branches:
      - "feat/lindsy-fastapi-microapp"
    paths:
      - "app/**"
      - "tests/test_lindsy.py"
      - "requirements.txt"
      - "requirements-test.txt"
      - ".github/workflows/lindsy-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Run Lindsy tests
        run: python -m pytest -q tests/test_lindsy.py
