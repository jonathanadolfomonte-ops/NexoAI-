name: Lindsy Android build

on:
  push:
    branches:
      - "feat/lindsy-promax-android-base"
    paths:
      - "mobile/android/**"
      - ".github/workflows/lindsy-android-build.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/lindsy-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android packages
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lindsy-promax-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured. Debug build completed; no installable release APK will be published."
          fi

      - name: Restore private signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/lindsy-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lindsy-signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lindsy-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle --no-daemon :app:assembleRelease
        working-directory: mobile/android

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lindsy-promax-android-release-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/lindsy-signing"
