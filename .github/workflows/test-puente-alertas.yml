name: Pruebas aisladas del puente de alertas

on:
  push:
    branches:
      - experimento-puente-alertas-789
    paths:
      - "cliente_puente_alertas.py"
      - "tests/test_cliente_puente_alertas.py"
      - "tests/puente-789.test.js"
      - "src/alertas/puente-789.js"
      - ".github/workflows/test-puente-alertas.yml"
  pull_request:
    branches:
      - experimento-puente-alertas-789
    paths:
      - "cliente_puente_alertas.py"
      - "tests/test_cliente_puente_alertas.py"
      - "tests/puente-789.test.js"
      - "src/alertas/puente-789.js"
      - ".github/workflows/test-puente-alertas.yml"

permissions:
  contents: read

jobs:
  pruebas-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ejecutar pruebas simuladas del puente
        run: node --test tests/puente-789.test.js

  pruebas-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar pruebas simuladas
        run: python -m unittest discover -s tests -p "test_cliente_puente_alertas.py" -v
