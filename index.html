<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: #11182d;
      border-bottom: 1px solid #27304a;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .logo span {
      color: #38d39f;
    }

    .subtitle {
      color: #9ca8c7;
      margin-top: 5px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin: 45px 10px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #aab4ce;
      line-height: 1.5;
    }

    .message {
      max-width: 85%;
      padding: 13px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.45;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #18223b;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      padding: 15px;
      background: #11182d;
      border-top: 1px solid #27304a;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: 1px solid #34405f;
      background: #0b1020;
      color: white;
      padding: 14px;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      background: #38d39f;
      color: #07140f;
      font-weight: bold;
      padding: 0 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.97);
    }

    .status {
      text-align: center;
      color: #38d39f;
      font-size: 12px;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Nexo<span>AI</span></div>
    <div class="subtitle">Asistente inteligente para tu negocio</div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>¡Hola! 👋</h1>
      <p>
        Soy NexoAI. Puedo ayudarte a atender clientes,
        responder consultas y organizar tu negocio.
      </p>
    </div>

  </main>

  <div class="status">
    ● NexoAI listo
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Escribe un mensaje..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">Enviar</button>
  </div>

</div>

<script>

function sendMessage() {

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();

  if (!text) return;

  if (welcome) {
    welcome.remove();
  }

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;

  chat.appendChild(userMessage);

  input.value = "";

  const botMessage = document.createElement("div");
  botMessage.className = "message bot";

  botMessage.textContent =
    "Hola 👋 Soy NexoAI. Recibí tu mensaje: \"" +
    text +
    "\". Esta es nuestra primera versión. Próximamente podremos conectarme con inteligencia artificial y WhatsApp Business.";

  setTimeout(function() {
    chat.appendChild(botMessage);
    chat.scrollTop = chat.scrollHeight;
  }, 500);

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("messageInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

</script>

</body>
</html>
