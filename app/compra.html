<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi compra · Moda Florencia</title>
<meta name="theme-color" content="#c4166f">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: catálogo de ropa de niños en tarjetas con bandas de color reales; talles 4 a 14 como regla; compra directa por WhatsApp. */
:root {
  --bg: #fff6f9;
  --surface: #ffffff;
  --fg: #2a1830;
  --muted: #6e5a76;
  --line: #f0d9e4;
  --accent: #c4166f;
  --accent-ink: #ffffff;
  --soft: #f3e6fb;
  --wa: #168a4a;
  --wa-ink: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1020; --surface: #271833; --fg: #f8eaf3; --muted: #bba6c6;
    --line: #3d2a4a; --accent: #ff5fae; --accent-ink: #2a0f1d; --soft: #33204a;
    --wa: #3ddc84; --wa-ink: #07281a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1020; --surface: #271833; --fg: #f8eaf3; --muted: #bba6c6;
  --line: #3d2a4a; --accent: #ff5fae; --accent-ink: #2a0f1d; --soft: #33204a;
  --wa: #3ddc84; --wa-ink: #07281a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.08; margin: 0; text-wrap: balance; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; text-decoration: none; }
.brand span { color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 20px; border-radius: 999px; border: 0;
  font: 700 0.95rem var(--font-body); text-decoration: none; cursor: pointer;
}
.btn-wa { background: var(--wa); color: var(--wa-ink); }
.btn-line { background: transparent; color: var(--fg); border: 2px solid var(--fg); }

.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 32px; align-items: center; padding-block: 28px 36px; }
.hero > * { min-width: 0; }
.eyebrow { font-weight: 700; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.hero h1 { font-size: clamp(2.2rem, 6.4vw, 4rem); font-weight: 800; letter-spacing: -0.02em; }
.hero p.lead { font-size: 1.1rem; color: var(--muted); max-width: 46ch; margin: 18px 0 24px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }

.ruler { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px 20px 18px; }
.ruler h2 { font-size: 1rem; font-weight: 800; letter-spacing: 0.01em; margin-bottom: 4px; }
.ruler p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; }
.ticks { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; align-items: end; }
.tick { text-align: center; font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.tick i { display: block; width: 100%; border-radius: 6px 6px 0 0; background: var(--accent); margin-bottom: 6px; }
.tick span { font-size: 0.95rem; }
.ruler small { display: block; margin-top: 12px; color: var(--muted); font-size: 0.85rem; }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; margin: 24px 0 18px; }
.section-head h2 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
.section-head p { margin: 0; color: var(--muted); max-width: 44ch; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.swatch img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.swatch .tag { position:relative; }
.install { display:none; }
.swatch { height: 220px; display: flex; align-items: flex-end; padding: 12px; position: relative; }
.swatch .tag { background: var(--surface); color: var(--fg); font-weight: 700; font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; }
.card .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h3 { font-size: 1.18rem; font-weight: 800; }
.card .desc { margin: 0; color: var(--muted); font-size: 0.92rem; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.dots li { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--soft); }
.dots b { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); display: inline-block; }
.card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }
.card .foot span { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.card .foot a { min-height: 40px; padding: 8px 16px; font-size: 0.88rem; }

.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; margin-top: 8px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.step h3 { font-size: 1.05rem; margin-bottom: 6px; }
.step p { margin: 0; color: var(--muted); font-size: 0.95rem; }

.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-top: 28px; }
.info div { background: var(--soft); border-radius: 16px; padding: 16px 18px; }
.info strong { display: block; font-family: var(--font-display); font-size: 1.02rem; margin-bottom: 2px; }
.info span { color: var(--muted); font-size: 0.93rem; }

.soon { margin-top: 28px; border: 2px dashed var(--accent); border-radius: 20px; padding: 20px 22px; display: flex; gap: 12px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.soon h3 { font-size: 1.3rem; }
.soon p { margin: 4px 0 0; color: var(--muted); }

footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
footer > * { min-width: 0; }
footer h3 { font-size: 1.05rem; margin-bottom: 8px; }
footer p { margin: 0 0 6px; color: var(--muted); }
.num { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.num code { font: 700 1rem var(--font-body); color: var(--fg); user-select: all; }
.copy { font: 600 0.8rem var(--font-body); background: var(--soft); color: var(--fg); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.fine { font-size: 0.8rem; color: var(--muted); width: 100%; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; gap: 22px; }
  .swatch { height: 200px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(120, 30, 90, .14); }
}
</style>
<style>
.calc{max-width:560px;margin:8px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.calc label{display:block;font-weight:700;margin:14px 0 6px}
.calc input,.calc select{width:100%;min-height:48px;font:500 1.05rem var(--font-body);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.calc input:focus,.calc select:focus{outline:3px solid var(--accent);outline-offset:2px}
.res{margin-top:20px;padding:18px;border-radius:16px;background:var(--soft);text-align:center}
.res .big{font:800 3.4rem/1 var(--font-display);color:var(--accent)}
.res p{margin:8px 0 0;color:var(--muted)}
.err{color:#b3261e;font-weight:700;margin-top:10px}
</style>
<style>
.cart-list{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.cart-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.cart-list b{display:block}
.cart-list span{color:var(--muted);font-size:.9rem}
.mini{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 .9rem var(--font-body);cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{color:var(--muted);text-align:center;margin:14px 0 0}
</style>
</head><body>
<div class="wrap">
<header class="top"><a class="brand" href="/app/">Moda <span>Florencia</span></a><a class="btn btn-line" href="/app/">Ir al catálogo</a></header>
<main>
<section class="section-head"><h2>Mi compra</h2><p>Esto es lo que elegiste hasta ahora. Podés seguir sumando o enviarlo por WhatsApp.</p></section>
<section class="calc" aria-live="polite">
<p class="empty" id="vacio">Todavía no elegiste nada.</p>
<ul class="cart-list" id="lista"></ul>
<p class="fine" id="tot" style="margin-top:12px" hidden></p>
<div class="cta-row" style="margin-top:14px;flex-direction:column">
<a class="btn btn-line" href="/app/pedido.html" id="seguir" style="width:100%">Seguir comprando</a>
<a class="btn btn-wa" id="wa" target="_blank" rel="noopener" href="#" style="width:100%" hidden>Enviar pedido por WhatsApp</a>
</div>
<button class="mini" id="vaciar" type="button" style="margin-top:12px" hidden>Vaciar compra</button>
<p class="fine" style="margin-top:12px">Los precios y el stock se confirman por WhatsApp. Retiro o entrega en la ciudad, sin costo.</p>
</section>
</main></div>
<script>
(function(){
  var BOT="5493873559322",KEY="mf-pedido",$=function(i){return document.getElementById(i)};
  var lista=$("lista"),vacio=$("vacio"),wa=$("wa"),vaciar=$("vaciar"),tot=$("tot"),seguir=$("seguir");
  var pedido=[];
  try{var g=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(g))pedido=g.filter(function(x){return x&&typeof x.n==="string"&&typeof x.c==="string"&&x.t>=4&&x.t<=14&&x.q>=1&&x.q<=20});}catch(e){}
  function guardar(){try{localStorage.setItem(KEY,JSON.stringify(pedido));}catch(e){}}
  function mensaje(p){
    var l=p.map(function(x,i){return (i+1)+") "+x.q+" x "+x.n+", color "+x.c+", talle "+x.t;});
    return "Hola! Quiero hacer este pedido:\n"+l.join("\n")+"\n¿Me confirmás precio y stock?";
  }
  function dibujar(){
    lista.innerHTML="";
    pedido.forEach(function(x,i){
      var li=document.createElement("li"),d=document.createElement("div"),a=document.createElement("b"),s=document.createElement("span"),b=document.createElement("button");
      a.textContent=x.q+" x "+x.n;s.textContent="Color "+x.c+" · Talle "+x.t;d.appendChild(a);d.appendChild(s);
      b.type="button";b.className="mini";b.textContent="Quitar";b.addEventListener("click",function(){pedido.splice(i,1);guardar();dibujar();});
      li.appendChild(d);li.appendChild(b);lista.appendChild(li);
    });
    var hay=pedido.length>0,u=pedido.reduce(function(s,x){return s+x.q},0);
    vacio.hidden=hay;wa.hidden=!hay;vaciar.hidden=!hay;tot.hidden=!hay;
    tot.textContent=u+(u===1?" prenda":" prendas")+" en total";
    seguir.textContent=hay?"Seguir comprando":"Empezar a comprar";
    if(hay)wa.href="https://wa.me/"+BOT+"?text="+encodeURIComponent(mensaje(pedido));
  }
  vaciar.addEventListener("click",function(){pedido=[];guardar();dibujar();});
  dibujar();
})();
</script></body></html>
